name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'sila/app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android project structure
        working-directory: sila/app
        run: |
          flutter create --platforms=android --project-name=sila --org=com.sila .
          rm -rf test

      - name: Fix compileSdk to 35
        working-directory: sila/app
        run: |
          FILE="android/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' $FILE
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' $FILE
            sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' $FILE
            sed -i 's/compileSdk 34/compileSdk 35/g' $FILE
            cat $FILE
          fi
          FILE2="android/app/build.gradle.kts"
          if [ -f "$FILE2" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' $FILE2
            cat $FILE2
          fi

      - name: Add INTERNET permission
        working-directory: sila/app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST

      - name: Change app display name to SILA
        working-directory: sila/app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:label="sila"|android:label="SILA"|g' $MANIFEST
          sed -i 's|android:label="Sila"|android:label="SILA"|g' $MANIFEST

      - name: Get dependencies
        working-directory: sila/app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: sila/app
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: sila/app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sila-app-release
          path: sila/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30